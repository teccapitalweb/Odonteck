<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c223d">
<title>Sin conexión · OdonTeck</title>
<link rel="apple-touch-icon" href="assets/img/odonteck-apple-touch.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/odonteck-favicon.png">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    font-family:'Inter',system-ui,-apple-system,sans-serif;color:#0d1b2f;
    background:linear-gradient(180deg,#f7f9fc 0%,#f1f5fb 100%);
  }
  .card{
    width:min(420px,100%);background:#fff;border:1px solid #dbe4ef;border-radius:22px;
    padding:32px 26px;text-align:center;box-shadow:0 18px 50px rgba(13,27,47,.12);
  }
  img{width:76px;height:76px;border-radius:18px;margin:0 auto 18px;display:block;object-fit:contain}
  h1{font-size:1.35rem;margin:0 0 10px;font-weight:800;line-height:1.25}
  p{margin:0 0 22px;color:#5f6f86;line-height:1.6;font-size:.98rem}
  button{
    width:100%;min-height:48px;border:none;border-radius:14px;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:1rem;color:#fff;background:#005187;
  }
  a{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;color:#005187;font-weight:700;text-decoration:none;font-size:.94rem}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/img/odonteck-favicon.png" alt="OdonTeck">
    <h1>Sin conexión</h1>
    <p>No pudimos cargar esta página porque el dispositivo no tiene internet en este momento. Las secciones que ya visitaste siguen disponibles.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <a href="./">Ir al inicio</a>
  </div>
  <script>
    // En cuanto vuelva la conexión, reintenta solo.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
